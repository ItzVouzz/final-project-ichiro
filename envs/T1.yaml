basic:
  checkpoint: null # set to -1 to load last saved model
  headless: false
  device: "cuda:0"
  max_iterations: 20000
  seed: 42 # set to -1 to choose random seed
  description: ""

env:
  num_envs: 8192
  num_observations: 58
  num_critic_obs: 70
  num_privileged_obs: 14
  num_amp_obs: 41
  num_actions: 15
  env_spacing: 1.

motion:
  motion_path: "data"
  reference_state_init: true
  replay_buffer_size: 1000000

runner:
  num_stack: 50
  horizon_length: 24
  save_path: "."
  save_interval: 100
  use_wandb: true

viewer:
  pos: [3., -3., 2.] # [m]
  lookat: [0., 0., 0.] # [m]
  record_video: false
  record_interval: 5. # [s]
  record_env_idx: 0

algorithm:
  num_learning_epochs: 5
  num_mini_batches: 4
  history_embedding_dim: 64
  learning_rate: 1.e-3
  discriminator_lr: 1.e-4
  gamma: 0.995
  lam: 0.95
  bound_coef: 100.0
  reconstruction_coef: 1.0
  entropy_coef: -0.01
  symmetric_coef: 10.
  amp_coef: 1.0
  grad_pen_coef: 5.0
  desired_kl: 0.01
  advantage_coef: [2.0, 1.0]
  amp_reward_coef: 0.3

sim:
  dt: 0.002
  substeps: 1
  up_axis: "z"
  gravity: [0.0, 0.0, -9.81]
  physics_engine: "physx" # "physx" or "flex"
  physx:
    num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
    solver_type: 1 # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 1
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 100.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

asset:
  file: "resources/T1.urdf"
  mujoco_file: "resources/T1.xml"
  name: "T1"
  base_name: "Trunk"
  head_name: "H2"
  foot_names: ["left_foot_link", "right_foot_link"]
  disable_gravity: false
  default_dof_drive_mode: 3 # see GymDofDriveModeFlags (0 is none, 1 is pos tgt, 2 is vel tgt, 3 effort)
  collapse_fixed_joints: true # bug: if collapse_fixed_joints = false, foot doesn't collide with ground
  fix_base_link: false # fix the base of the robot
  self_collisions: 0 # 1 to disable, 0 to enable...bitwise filter
  replace_cylinder_with_capsule: false # replace collision cylinders with capsules, leads to faster/more stable simulation
  flip_visual_attachments: false # Some .obj meshes must be flipped from y-up to z-up
  density: 0.001
  angular_damping: 0.
  linear_damping: 0.
  max_angular_velocity: 1000.
  max_linear_velocity: 1000.
  armature: 0.
  thickness: 0.01
  feet_edge_pos: [[ 0.1215,  0.05, -0.0432508],
                  [ 0.1215, -0.05, -0.0432508],
                  [-0.1015,  0.05, -0.0432508],
                  [-0.1015, -0.05, -0.0432508]] # x,y,z [m]
  camera_pos: [0.07, 0.0, 0.11] # x,y,z [m]
  camera_fov: [87, 58] # H, V

init_state:
  pos: [0.0, 0.0, 0.72] # x,y,z [m]
  rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
  lin_vel: [0.0, 0.0, 0.0] # x,y,z [m/s]
  ang_vel: [0.0, 0.0, 0.0] # x,y,z [rad/s]
  default_joint_angles: {"Hip_Pitch": -0.2, "Knee_Pitch": 0.4, "Ankle_Pitch": -0.25, "default": 0.} # target angles when action = 0.0

control:
  stiffness: {"Head": 50, "Waist": 200., "Hip": 200., "Knee": 200., "Ankle": 50.} # [N*m/rad]
  damping: {"Head": 1, "Waist": 5., "Hip": 5., "Knee": 5., "Ankle": 1.} # [N*m*s/rad]
  action_scale: 1.
  decimation: 10

terrain:
  type: "trimesh" # "plane" or "trimesh"
  static_friction: 0.5
  dynamic_friction: 0.5
  restitution: 0.
  # trimesh only:
  terrain_length: 20.
  terrain_width: 20.
  border_size: 20.
  num_terrains: 8
  terrain_proportions: [0.0, 0.0, 0.5, 0.5] # terrain types: [plane, slope, random, discrete]
  slope: 0.1
  random_height: 0.05
  discrete_height: 0.02
  horizontal_scale: 0.1
  vertical_scale: 0.005
  slope_threshold: 2.0

normalization:
  gravity: 1.0
  lin_vel: 1.0
  ang_vel: 1.0
  dof_pos: 1.0
  dof_vel: 0.1
  push_force: 0.1
  push_torque: 0.5
  clip_actions: 1.

noise:
  gravity:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  lin_vel:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  ang_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  dof_pos:
    range: [0., 0.01]
    operation: "additive"
    distribution: "gaussian"
  dof_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  height:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"
  goal_pos:
    range: [0., 0.5]
    operation: "additive"
    distribution: "gaussian"
  base_yaw:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"

randomization:
  init_dof_pos:
    range: [0., 0.05]
    operation: "additive"
    distribution: "gaussian"
  init_base_pos_xy:
    range: [-1., 1.]
    operation: "additive"
    distribution: "uniform"
  init_base_lin_vel_xy:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"

  kick_interval_s: 2.
  kick_lin_vel:
    range: [0., 0.1]
    operation: "additive"
    distribution: "gaussian"
  kick_ang_vel:
    range: [0., 0.02]
    operation: "additive"
    distribution: "gaussian"

  push_interval_s: 5.
  push_duration_s: 1.
  push_force:
    range: [0., 20.]
    operation: "additive"
    distribution: "gaussian"
  push_torque:
    range: [0., 2.]
    operation: "additive"
    distribution: "gaussian"

  reset_ball_prob: 1.e-3
  kick_ball_prob: 5.e-3
  kick_ball_vel: 0.5
  ball_delay_step:
    range: [6, 1]
    operation: "additive"
    distribution: "gaussian"

  dof_offset:
    range: [-0.05, 0.05]
    operation: "additive"
    distribution: "uniform"
  dof_stiffness:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  dof_damping:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"

  friction:
    range: [0.0, 1.0]
    operation: "additive"
    distribution: "uniform"
  compliance:
    range: [0.5, 1.5]
    operation: "additive"
    distribution: "uniform"
  restitution:
    range: [0.0, 1.0]
    operation: "additive"
    distribution: "uniform"

  base_com:
    range: [-0.05, 0.05]
    operation: "additive"
    distribution: "uniform"
  base_mass:
    range: [0.95, 1.05]
    operation: "scaling"
    distribution: "uniform"
  other_com:
    range: [-0.005, 0.005]
    operation: "additive"
    distribution: "uniform"
  other_mass:
    range: [0.98, 1.02]
    operation: "scaling"
    distribution: "uniform"

  ball_mass:
    range: [0.4, 0.45]
    operation: "additive"
    distribution: "uniform"
  ball_restitution:
    range: [0.0, 1.0]
    operation: "additive"
    distribution: "uniform"
  ball_friction:
    range: [0.1, 0.3]
    operation: "additive"
    distribution: "uniform"

rewards:
  scales:
    survival: 3.
    termination: -1000.
    pos_still: -100.
    goal: 15.
    ball_distance: 50.
    goal_distance: 500.
    kick_ball: -20.
    side_kick_ball: 20.
    face_ball_pitch: -0.5
    face_ball_yaw: -0.5
    root_acc: -1.e-3
    action_rate: -1.
    head_action_rate: -15.
    dof_pos_limits: -100.
    collision: -100.
    feet_min_distance: -5.
  rew_group_item: ["goal", "ball_distance", "goal_distance"]
  episode_length_s: 60.
  terminate_height: 0.45
  terminate_vel: 50.
  terminate_contacts_on: []
  penalize_contacts_on: ["Trunk", "H1", "H2", "AL", "AR", "Waist", "Hip", "Shank", "Ankle"]
  only_positive_rewards: false # if true negative total rewards are clipped at zero (avoids early termination problems)
  soft_dof_pos_limit: 0.9 # percentage of urdf limits, values above this limit are penalized
  max_kick_vel: 2.0
  feet_min_distance: 0.1
  penalize_pos: 0.7
  penalize_yaw: 1.0
  penalize_pos_distance: 1.0
